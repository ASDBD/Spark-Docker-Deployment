# Valori di default per tutti i laboratori.
# Possono essere sovrascritti nel notebook con SparkSession.builder.config(...)

# Risorse contenute: i laboratori devono girare anche su un portatile
spark.driver.memory              1g
spark.executor.memory            768m
spark.executor.cores             1

# Event log: permette di rivedere i job conclusi con lo Spark History Server
spark.eventLog.enabled           true
spark.eventLog.dir               file:///opt/spark-events
spark.history.fs.logDirectory    file:///opt/spark-events
