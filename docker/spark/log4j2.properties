# Log ridotti a WARN per non sommergere l'output dei notebook
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# I demoni (master/worker) restano a INFO: si vede la registrazione dei nodi
logger.master.name = org.apache.spark.deploy.master
logger.master.level = info
logger.worker.name = org.apache.spark.deploy.worker
logger.worker.level = info
logger.connect.name = org.apache.spark.sql.connect.service
logger.connect.level = info
