services:
  # ---------------------------
  # SPARK MASTER
  # ---------------------------
  spark-master:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-master
    hostname: spark-master
    user: root
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master internal URL
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./shared:/home/jovyan/shared
    networks:
      - spark-network

  # ---------------------------
  # SPARK WORKERS (3 Nodes)
  # ---------------------------
  spark-worker-1:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./shared:/home/jovyan/shared
    networks:
      - spark-network

  spark-worker-2:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker-2
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./shared:/home/jovyan/shared
    networks:
      - spark-network

  spark-worker-3:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker-3
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./shared:/home/jovyan/shared
    networks:
      - spark-network

  # ---------------------------
  # HDFS NAMENODE (Master)
  # ---------------------------
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    command: [ "hdfs", "namenode" ]
    ports:
      - 9870:9870
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    networks:
      - spark-network
  datanode:
    image: apache/hadoop:3
    command: [ "hdfs", "datanode" ]
    env_file:
      - ./config
    deploy:
      replicas: 3
    networks:
      - spark-network
  resourcemanager:
    image: apache/hadoop:3
    hostname: resourcemanager
    command: [ "yarn", "resourcemanager" ]
    ports:
      - 8088:8088
    env_file:
      - ./config
    networks:
      - spark-network
  nodemanager:
    image: apache/hadoop:3
    command: [ "yarn", "nodemanager" ]
    env_file:
      - ./config
    networks:
      - spark-network

  # ---------------------------
  # JUPYTER NOTEBOOK (Driver)
  # ---------------------------
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter-spark
    ports:
      - "8888:8888" # Jupyter Web UI
      - "4040:4040" # Spark Application UI
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_HOST=jupyter-spark
      - JUPYTER_TOKEN=spark-password
    volumes:
      - ./shared:/home/jovyan/shared
      - ./notebooks:/home/jovyan/notebooks
    networks:
      - spark-network

  # ---------------------------
  # DATABASES
  # ---------------------------
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - spark-network

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testdb
    ports:
      - "3306:3306"
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
